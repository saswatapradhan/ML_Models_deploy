name: Build and Push Telco Churn Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build, Test and Push Telco Churn Image
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. DOWNLOAD CI DATASET
      # ============================================================

      - name: Download Telco dataset
        run: |
          mkdir -p data/raw
          curl -L "https://raw.githubusercontent.com/Giskard-AI/examples/main/datasets/WA_Fn-UseC_-Telco-Customer-Churn.csv" \
            -o data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv


      # ============================================================
      # 5. RUN PYTEST
      # ============================================================

      - name: Run tests
        run: |
          python -m pytest -v


      # ============================================================
      # 6. RUN ML PIPELINE
      # ============================================================

      - name: Run ML pipeline
        run: |
          python scripts/run_pipeline.py \
            --input "data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv"


      # ============================================================
      # 7. RUN MODEL QUALITY GATE
      # ============================================================

      - name: Run model quality gate
        run: |
          python scripts/model_quality_gate.py


      # ============================================================
      # 8. SETUP DOCKER BUILDX
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # 9. LOGIN TO DOCKER HUB
      # ============================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ============================================================
      # 10. BUILD AND PUSH DOCKER IMAGE
      # ============================================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true

          # Docker Hub repository
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/telco-fastapi:latest

          # GitHub Actions Docker layer cache
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ============================================================
      # 11. LOGOUT FROM DOCKER HUB
      # ============================================================

      - name: Logout from Docker Hub
        run: docker logout